[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/bin/sh -c 'exec /usr/local/bin/php /var/www/artisan queue:work "${QUEUE_CONNECTION}" --queue="${QUEUE_NAMES}" --sleep="${QUEUE_SLEEP}" --tries="${QUEUE_TRIES}" --timeout="${QUEUE_TIMEOUT}" --max-time="${QUEUE_MAX_TIME}" --memory="${QUEUE_MEMORY}" --no-interaction'
directory=/var/www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=%(ENV_QUEUE_PROCESSES)s
stopsignal=TERM
stopwaitsecs=90
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:laravel-scheduler]
command=/usr/local/bin/php /var/www/artisan schedule:work --no-interaction
directory=/var/www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=25

; OPTIONAL HORIZON REFERENCE - DISABLED
; Laravel Horizon is not currently installed and must not be enabled unless it
; becomes an explicit project dependency. If Horizon consumes the same queues
; as laravel-queue-worker, disable laravel-queue-worker first to avoid duplicate
; queue consumers.
;
; [program:laravel-horizon]
; command=/usr/local/bin/php /var/www/artisan horizon
; directory=/var/www
; user=www-data
; autostart=false
; autorestart=true
; stopasgroup=true
; killasgroup=true
; stopsignal=TERM
; stopwaitsecs=300
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/stderr
; stderr_logfile_maxbytes=0

; OPTIONAL REVERB REFERENCE - DISABLED
; Production Reverb currently runs from a separate Git repository, separate
; Docker image, separate Coolify Application, and separate container. It must
; not autostart in this main source-code container. This template is retained
; only in case the production architecture is intentionally changed later.
;
; [program:laravel-reverb]
; command=/usr/local/bin/php /var/www/artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
; directory=/var/www
; user=www-data
; autostart=false
; autorestart=true
; stopasgroup=true
; killasgroup=true
; stopsignal=TERM
; stopwaitsecs=300
; stdout_logfile=/dev/stdout
; stdout_logfile_maxbytes=0
; stderr_logfile=/dev/stderr
; stderr_logfile_maxbytes=0
